<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Tablas</title>
	<style>
		th{
			color:indigo;
			background-color:grey;
			text-align:center;
		}
		.sistemas{
			background-color:greenyellow;
		}
		.aplwe{
			background-color:hotpink;
		}
		.serre{
			background-color:lightgreen;
		}
		.ingles{
			background-color:mediumpurple;
		}
		.segin{
			background-color:skyblue;
		}
		.ip{
			background-color:antiquewhite;
		}
		.pi{
			background-color:salmon;
		}
		.pw{
			background-color:lavender;
		}
	</style>
</head>
<body>
	<table border="2">
		<caption style="color:blue; background-color:pink">HORARIO</caption>
		<tr>
			<th style="background-color:white"></th>
			<th>L</th>
			<th>M</th>
			<th>X</th>
			<th>J</th>
			<th>V</th>
		</tr>
		<tr>
			<td>8:30-9:30</td>
			<td rowspan="2" class="sistemas">SIOPR</td>
			<td rowspan="2" class="aplwe">APLWE</td>
			<td rowspan="2" class="serre">SERRE</td>
			<td class="sistemas">SIORP</td>
			<td class="ingles">INGLES</td>
		</tr>
		<tr>
			<td>9:30-10:30</td>
			
			<td class= "segin">SEGIN</td>
			<td class="ip">IP2</td>
		</tr>
			
		<tr>
			<td>10:30-11:30</td>
			<td class="serre">SERRE</td>
			<td class= "segin">SEGIN</td>
			<td class="pi">PI</td>
			<td class="aplwe">APLWE</td>
			<td class="serre">SERRE</td>

		</tr>
		<tr>
			<td>11:30-12:00</td>
			<td colspan="5">RECREO</td>
		</tr>
		<tr>
			<td>12:00-13:00</td>
			<td class="serre">SERRE</td>
			<td class="ip">IP2</td>
			<td class="pi">PI</td>
			<td class="aplwe">APLWE</td>
			<td class="serre">SERRE</td>
		</tr>
		<tr>
			<td>13:00-14:00</td>
			<td class= "segin">SEGIN</td>
			<td rowspan="2" class="sistemas">SIOPR</td>
			<td class="ip">IP2</td>
			<td rowspan="2" class="pw">PW</td>
			<td class="sistemas">SIOPR</td>
		</tr>
		<tr>
			<td>14:00-15:00</td>
			<td class="ingles">IPGM</td>
			
			
			<td class="pw">PW</td>
			<td class= "segin">SEGIN</td>
		</tr>
	</table>

</body>
</html>
